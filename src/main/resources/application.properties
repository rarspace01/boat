logging.file.name=boat.log
server.tomcat.threads.max=250
server.tomcat.max-keep-alive-requests=-1
spring.mvc.dispatch-options-request=true
# behind a reverse proxy on the same machine or network the client address comes from its X-Forwarded-For (only from
# addresses of the local network, Tomcat's default internal proxies), the failed logins are counted per client address
server.forward-headers-strategy=native
