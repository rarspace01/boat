name: 🤖 autoupdate
on:
  # updates the pull requests against a branch when that branch changes, they are all against main
  push:
    branches: [ main ]

# the action works with the personal token (pushes of GITHUB_TOKEN don't start the CI of the pull requests)
permissions: {}

jobs:
  autoupdate:
    name: autoupdate
    runs-on: ubuntu-latest
    steps:
      # pinned by digest, the image gets the personal token: a moved tag must not be able to take it
      - uses: docker://chinthakagodawita/autoupdate-action@sha256:53d7013ad4689b703d2715d4b17d4901bb0a385e495e0b481f37adbe9b3cc3fc # v1
        env:
          GITHUB_TOKEN: '${{ secrets.AUTOPR }}'
