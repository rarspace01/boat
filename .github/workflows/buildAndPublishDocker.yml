name: buildAndPublishDocker

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  buildAndPublishDocker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # a builder which can store its layer cache in the GitHub Actions cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (with cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/boat:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # a plain image: an index with an attestation manifest has untagged child versions, which the cleanup below deletes
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.description=boat dockerimage image
      - name: Delete old Docker images except latest
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: boat
          package-type: container
          min-versions-to-keep: 1
          ignore-versions: '^latest$'
