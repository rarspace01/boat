name: Live tests

# The tests tagged "live" talk to the real search engines, TMDB/TVDB and trackers. They are not part of the build,
# sites go down and change, so they run once a week and on request.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  liveTest:
    name: Live tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run live tests
        env:
          TFDB_APIKEY: ${{ secrets.TFDB_APIKEY }}
          TVDB_APIKEY: ${{ secrets.TVDB_APIKEY }}
          PREMIUMIZE_APIKEY: ${{ secrets.PREMIUMIZE_APIKEY }}
          ALLDEBRID_APIKEY: ${{ secrets.ALLDEBRID_APIKEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: ./gradlew liveTest
